# Checks a "Submit a training run" issue and comments the result. A pull request that appends the record is opened
# only when a MAINTAINER adds the `contrib-approved` label, and only from the record as it stood at that moment.
#
# Security:
# * The issue body is untrusted. It is never interpolated into a shell line: the validator reads it from the event
#   JSON file ($GITHUB_EVENT_PATH), the comment text is read from a file the validator wrote, and only booleans,
#   hex digests and integers reach $GITHUB_OUTPUT and `with:` inputs. The code that runs is the default branch's.
# * Approval is a label, and only a label added by someone with write access counts (checked against the API).
#   Editing the issue body after approval removes the label (the record changed under the reviewer), and the pull
#   request branch carries the record's content hash, so an edit can never rewrite a pull request that was
#   already reviewed: a changed record needs a fresh approval and gets a new branch.
# * The job that holds a write token runs no Python and installs nothing: it appends the line the read-only check
#   job produced in this same run and hands it to create-pull-request. Credentials are never persisted to disk.
# * Every action is pinned to a full commit SHA (the tag is in the comment; Dependabot keeps them current), and the
#   check job installs numpy from a hash-locked file without a cache.
name: Contribution check

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions: {}

concurrency:
  group: contrib-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'run-submission') || startsWith(github.event.issue.title, '[run]')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'contrib-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
      hash: ${{ steps.validate.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install (hash-locked, binary wheels only)
        run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-lock.txt'
      - name: Validate the record (read from the event file)
        id: validate
        run: >-
          python -m ffsim contrib validate --issue-event "$GITHUB_EVENT_PATH" --out-dir contrib-check
          --github-output "$GITHUB_OUTPUT" --always-zero --guard
      - name: Comment the result; withdraw approval after an edit; redact a leaked secret
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SECRET_FOUND: ${{ steps.validate.outputs.secret }}
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('contrib-check/comment.md', 'utf8');
            const marker = '<!-- ffsim-contrib-check -->';
            const label = 'contrib-approved';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const p = context.payload;
            const labels = (p.issue.labels || []).map(l => l.name);
            if (p.action === 'edited' && p.changes && p.changes.body && labels.includes(label)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              body += '\nThe record was edited after it was approved, so the approval was withdrawn: a maintainer ' +
                      'needs to review it again.\n';
            }
            if (process.env.SECRET_FOUND === 'true') {
              await github.rest.issues.update({ owner, repo, issue_number,
                body: 'The original text was removed by the contribution check because it looked like it ' +
                      'contained a secret or personal data. See the comment below.' });
            }
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user && c.user.login === 'github-actions[bot]' &&
                                            (c.body || '').startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Keep the validated line for the pull-request job
        if: steps.validate.outputs.valid == 'true' && github.event.action == 'labeled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contrib-record
          path: |
            contrib-check/contrib-line.jsonl
            contrib-check/pr-body.md
          retention-days: 3

  pull-request:
    needs: check
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'contrib-approved' &&
      needs.check.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Only a label added by a maintainer counts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const username = context.payload.sender.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed('the contrib-approved label was added by an account without write access');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contrib-record
          path: contrib-check
      - name: Append the line the check job validated (no Python, no installs in this job)
        run: |
          mkdir -p research/sim-data/contrib
          test "$(wc -l < contrib-check/contrib-line.jsonl)" -eq 1
          cat contrib-check/contrib-line.jsonl >> research/sim-data/contrib/runs-contrib.jsonl
      - name: Open the pull request (one branch per approved record version)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: contrib/issue-${{ github.event.issue.number }}-${{ needs.check.outputs.hash }}
          base: ${{ github.event.repository.default_branch }}
          add-paths: research/sim-data/contrib/runs-contrib.jsonl
          commit-message: "Add contributed run from issue #${{ github.event.issue.number }}"
          title: "Add contributed run (issue #${{ github.event.issue.number }})"
          body-path: contrib-check/pr-body.md
          labels: contrib
          delete-branch: true
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
