name: Paper

# Builds paper/main.tex into a PDF on every push or pull request that touches the paper, its figures, or the data
# and code its numbers come from, and uploads the PDF as a workflow artifact (Actions -> this run -> Artifacts).
# It also uploads the generated main.bbl and an arXiv source bundle (artifact arxiv-source) that includes it, after
# compiling that bundle on its own without BibTeX, as arXiv will.
on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "docs/figures/**"
      - "results/**"
      - "research/sim-data/**"
      - "ffsim/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "docs/figures/**"
      - "results/**"
      - "research/sim-data/**"
      - "ffsim/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: numbers and LaTeX sources are consistent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r paper/requirements.txt
      - name: Regenerate numbers and tables from the data
        run: python paper/analysis/make_all.py
      - name: numbers.tex and tables/ are up to date with the data
        # Figures are not compared byte for byte (fonts differ between machines); numbers and tables must match.
        run: git diff --exit-code -- paper/numbers.tex paper/tables
      - name: Static LaTeX checks (labels, references, citations, figures, values, braces)
        run: python paper/check_tex.py

  build:
    name: build the PDF
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile paper/main.tex
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Report overfull boxes and undefined references
        if: always()
        run: |
          grep -n "Overfull \\\\hbox\|Overfull \\\\vbox\|undefined\|Float too large" paper/main.log || echo "none"
      - name: Upload the PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-pdf
          path: |
            paper/main.pdf
            paper/main.log
          if-no-files-found: error
          retention-days: 30
      - name: Compile the review copy (paper/main-review.tex, footer marks a draft shared for comments)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: main-review.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Upload the review copy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-review-pdf
          path: paper/main-review.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Upload main.bbl
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-bbl
          path: paper/main.bbl
          if-no-files-found: error
          retention-days: 30
      - name: Assemble the arXiv source bundle (with main.bbl)
        run: python3 paper/make_bundle.py --out paper/build/arxiv-source --bbl paper/main.bbl
      - name: Unpack the bundle into a clean folder
        # The stand-alone compile below sees exactly the files in the zip that goes to arXiv.
        run: python3 -m zipfile -e paper/build/arxiv-source.zip paper/build/arxiv-check
      - name: Compile the bundle on its own, without BibTeX (arXiv uses main.bbl)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: main.tex
          working_directory: paper/build/arxiv-check
          args: -pdf -bibtex- -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Every citation in the bundle resolves from main.bbl
        run: |
          if grep -nE "Citation .* undefined|There were undefined citations" paper/build/arxiv-check/main.log; then
            echo "::error::the arXiv bundle has undefined citations: main.bbl is missing or out of date"
            exit 1
          fi
          echo "none undefined"
      - name: Upload the arXiv source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arxiv-source
          path: paper/build/arxiv-source.zip
          if-no-files-found: error
          retention-days: 30
